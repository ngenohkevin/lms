# Fluentd Configuration for LMS Backend Log Aggregation

# Source: Application logs from file
<source>
  @type tail
  path /var/log/lms/application.log
  pos_file /var/log/fluentd/lms-app.log.pos
  tag lms.application
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%LZ
  rotate_wait 5s
  refresh_interval 10s
  emit_unmatched_lines true
  read_from_head false
</source>

# Source: Error logs
<source>
  @type tail
  path /var/log/lms/error.log
  pos_file /var/log/fluentd/lms-error.log.pos
  tag lms.error
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%LZ
</source>

# Source: Access logs
<source>
  @type tail
  path /var/log/lms/access.log
  pos_file /var/log/fluentd/lms-access.log.pos
  tag lms.access
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%LZ
</source>

# Source: Security logs
<source>
  @type tail
  path /var/log/lms/security.log
  pos_file /var/log/fluentd/lms-security.log.pos
  tag lms.security
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%LZ
</source>

# Source: Business logs
<source>
  @type tail
  path /var/log/lms/business.log
  pos_file /var/log/fluentd/lms-business.log.pos
  tag lms.business
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%LZ
</source>

# Source: System logs
<source>
  @type systemd
  tag system
  path /var/log/journal
  matches [{"_SYSTEMD_UNIT": "lms-backend.service"}]
  read_from_head false
</source>

# Source: Docker container logs
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Filter: Add common fields
<filter lms.**>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    service "lms-backend"
    environment "#{ENV['ENVIRONMENT'] || 'production'}"
    version "#{ENV['VERSION'] || '1.0.0'}"
  </record>
</filter>

# Filter: Parse and enrich error logs
<filter lms.error>
  @type parser
  key_name message
  reserve_data true
  inject_key_prefix parsed_
  <parse>
    @type json
  </parse>
</filter>

# Filter: GeoIP lookup for access logs
<filter lms.access>
  @type geoip
  geoip_lookup_keys client_ip
  <record>
    location_country_name ${country_name["client_ip"]}
    location_city_name ${city_name["client_ip"]}
    location_latitude ${latitude["client_ip"]}
    location_longitude ${longitude["client_ip"]}
  </record>
</filter>

# Filter: Detect anomalies
<filter lms.**>
  @type anomalydetect
  outlier_term 30
  outlier_percent 0.01
  smooth_term 300
  tag_suffix .anomaly
</filter>

# Filter: Prometheus metrics export
<filter lms.**>
  @type prometheus
  <metric>
    name fluentd_input_status_num_records_total
    type counter
    desc The total number of incoming records
    <labels>
      tag ${tag}
      hostname ${hostname}
    </labels>
  </metric>
</filter>

# Output: Elasticsearch for log search and analysis
<match lms.application>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name lms-application-%Y%m%d
  type_name _doc
  include_timestamp true
  logstash_format true
  logstash_prefix lms-application
  logstash_dateformat %Y%m%d
  template_name lms_template
  template_file /etc/fluentd/templates/lms_template.json
  template_overwrite true
  <buffer>
    @type file
    path /var/log/fluentd/buffer/elasticsearch-application
    chunk_limit_size 32MB
    queue_limit_length 512
    flush_interval 10s
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

<match lms.error>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name lms-errors-%Y%m%d
  type_name _doc
  include_timestamp true
  logstash_format true
  logstash_prefix lms-errors
  logstash_dateformat %Y%m%d
  <buffer>
    @type file
    path /var/log/fluentd/buffer/elasticsearch-errors
    chunk_limit_size 16MB
    queue_limit_length 256
    flush_interval 5s
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

<match lms.security>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name lms-security-%Y%m%d
  type_name _doc
  include_timestamp true
  logstash_format true
  logstash_prefix lms-security
  logstash_dateformat %Y%m%d
  <buffer>
    @type file
    path /var/log/fluentd/buffer/elasticsearch-security
    chunk_limit_size 16MB
    queue_limit_length 256
    flush_interval 5s
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

# Output: Alert high-priority errors to Slack
<match lms.error>
  @type copy
  <store>
    @type relabel
    @label @ERROR_NOTIFICATION
  </store>
  <store>
    @type null
  </store>
</match>

<label @ERROR_NOTIFICATION>
  <filter lms.error>
    @type grep
    <regexp>
      key level
      pattern ^(ERROR|FATAL|PANIC)$
    </regexp>
  </filter>
  
  <match lms.error>
    @type slack
    webhook_url "#{ENV['SLACK_WEBHOOK_URL']}"
    channel "#alerts"
    username "LMS-Bot"
    icon_emoji ":warning:"
    color danger
    title "LMS Backend Error Alert"
    message "Error: %s\nTimestamp: %s\nHost: %s"
    message_keys message,timestamp,hostname
    flush_interval 60s
  </match>
</label>

# Output: Business metrics to InfluxDB
<match lms.business>
  @type influxdb
  host influxdb
  port 8086
  dbname lms_business_metrics
  user "#{ENV['INFLUXDB_USER']}"
  password "#{ENV['INFLUXDB_PASSWORD']}"
  use_ssl false
  verify_ssl false
  time_precision s
  <buffer>
    @type memory
    chunk_limit_size 64KB
    queue_limit_length 128
    flush_interval 10s
  </buffer>
</match>

# Output: System metrics to separate index
<match system>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name lms-system-%Y%m%d
  type_name _doc
  include_timestamp true
  logstash_format true
  logstash_prefix lms-system
  logstash_dateformat %Y%m%d
</match>

# Output: Catch-all for other logs
<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name lms-misc-%Y%m%d
  type_name _doc
  include_timestamp true
  logstash_format true
  logstash_prefix lms-misc
  logstash_dateformat %Y%m%d
  <buffer>
    @type file
    path /var/log/fluentd/buffer/elasticsearch-misc
    chunk_limit_size 16MB
    queue_limit_length 128
    flush_interval 30s
  </buffer>
</match>

# Prometheus metrics endpoint
<source>
  @type prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>

<source>
  @type prometheus_monitor
  <labels>
    host "#{Socket.gethostname}"
    service lms-backend
  </labels>
</source>

<source>
  @type prometheus_output_monitor
  <labels>
    host "#{Socket.gethostname}"
    service lms-backend
  </labels>
</source>

<source>
  @type prometheus_tail_monitor
  <labels>
    host "#{Socket.gethostname}"
    service lms-backend
  </labels>
</source>