# Docker Security Configuration for LMS Backend
# This file contains security settings for Docker containers

version: '3.8'

services:
  lms-backend:
    image: lms-backend:latest
    
    # Security context
    user: "1000:1000"  # Run as non-root user
    
    security_opt:
      - no-new-privileges:true  # Prevent privilege escalation
      - seccomp:unconfined      # Use default seccomp profile
      - apparmor:docker-default # Use default AppArmor profile
    
    # Read-only root filesystem
    read_only: true
    
    # Temporary directories for writable data
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
      - /var/log:noexec,nosuid,size=500m
    
    # Resource limits
    mem_limit: 1g
    mem_reservation: 512m
    cpus: '1.0'
    
    # Prevent container from gaining new privileges
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Only allow binding to privileged ports
    
    # Environment variables (use secrets in production)
    environment:
      - ENVIRONMENT=production
      - LMS_SERVER_PORT=8080
      - LMS_LOG_LEVEL=info
    
    # Network security
    networks:
      - lms_internal
    
    # Health check
    healthcheck:
      test: ["CMD", "./lms", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=lms-backend"
    
    # Volume mounts with security options
    volumes:
      - type: volume
        source: lms_uploads
        target: /app/uploads
        read_only: false
        volume:
          nocopy: true
      - type: bind
        source: ./configs/production
        target: /etc/lms
        read_only: true
        bind:
          create_host_path: false
    
    # PID limits
    pids_limit: 200
    
    # Ulimits
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

  postgres:
    image: postgres:15-alpine
    
    # Security context
    user: "999:999"  # postgres user
    
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    
    # Read-only root filesystem with writable data directory
    read_only: true
    
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
      - /run:noexec,nosuid,size=100m
    
    # Resource limits
    mem_limit: 2g
    mem_reservation: 1g
    cpus: '1.5'
    
    # Capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    
    # Environment variables
    environment:
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_INITDB_ARGS=--auth-host=md5 --auth-local=peer
    
    # Secrets (use Docker secrets in production)
    secrets:
      - postgres_db
      - postgres_user
      - postgres_password
    
    # Network security
    networks:
      - lms_internal
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d $$(cat /run/secrets/postgres_db)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres"
    
    # Volume with security options
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        volume:
          nocopy: true
    
    # PostgreSQL configuration for security
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      -c log_connections=on
      -c log_disconnections=on
      -c log_statement=mod
      -c log_min_duration_statement=1000
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.7
      -c wal_buffers=16MB
      -c default_statistics_target=100

  redis:
    image: redis:7-alpine
    
    # Security context
    user: "999:999"  # redis user
    
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    
    # Read-only root filesystem
    read_only: true
    
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /var/tmp:noexec,nosuid,size=25m
    
    # Resource limits
    mem_limit: 512m
    mem_reservation: 256m
    cpus: '0.5'
    
    # Capabilities
    cap_drop:
      - ALL
    
    # Environment variables
    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    
    # Secrets
    secrets:
      - redis_password
    
    # Network security
    networks:
      - lms_internal
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$(cat /run/secrets/redis_password)", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        labels: "service=redis"
    
    # Redis configuration for security
    command: >
      redis-server
      --requirepass "file:/run/secrets/redis_password"
      --protected-mode yes
      --port 6379
      --bind 127.0.0.1
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 300
      --supervised no
      --loglevel notice
      --databases 16
      --save 900 1
      --save 300 10
      --save 60 10000
      --stop-writes-on-bgsave-error yes
      --rdbcompression yes
      --rdbchecksum yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite no
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb

  nginx:
    image: nginx:1.24-alpine
    
    # Security context
    user: "101:101"  # nginx user
    
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    
    # Read-only root filesystem with writable directories
    read_only: true
    
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
      - /var/cache/nginx:noexec,nosuid,size=100m
      - /var/run:noexec,nosuid,size=50m
    
    # Resource limits
    mem_limit: 256m
    mem_reservation: 128m
    cpus: '0.5'
    
    # Capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    
    # Network configuration
    ports:
      - "80:80"
      - "443:443"
    
    networks:
      - lms_internal
      - lms_external
    
    # Health check
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=nginx"
    
    # Configuration and SSL certificates
    volumes:
      - type: bind
        source: ./configs/security/nginx-security.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: /etc/ssl/lms
        target: /etc/ssl/lms
        read_only: true
    
    depends_on:
      - lms-backend

# Network configuration
networks:
  lms_internal:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: lms_internal
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.driver.mtu: "1500"
  
  lms_external:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
    driver_opts:
      com.docker.network.bridge.name: lms_external
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"

# Volume configuration
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/lms/postgres
  
  lms_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/lms/uploads

# Secrets configuration (use external secrets in production)
secrets:
  postgres_db:
    external: true
  postgres_user:
    external: true  
  postgres_password:
    external: true
  redis_password:
    external: true

# Additional security configurations
x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
  read_only: true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Monitoring services (optional)
x-monitoring:
  prometheus:
    image: prom/prometheus:latest
    <<: *security-defaults
    user: "nobody"
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    cpus: '0.5'
    networks:
      - lms_internal
    volumes:
      - type: bind
        source: ./configs/monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.wal-compression'

  grafana:
    image: grafana/grafana:latest
    <<: *security-defaults
    user: "472"  # grafana user
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: '0.3'
    networks:
      - lms_internal
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_SECURITY_SECRET_KEY__FILE=/run/secrets/grafana_secret_key
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=https://lms.example.com/grafana/
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SECURITY_CONTENT_TYPE_PROTECTION=true
      - GF_SECURITY_X_CONTENT_TYPE_OPTIONS=nosniff
      - GF_SECURITY_X_XSS_PROTECTION=true
    secrets:
      - grafana_admin_password
      - grafana_secret_key